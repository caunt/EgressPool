name: NuGet Workflow

on:
  workflow_call:
    inputs:
      dotnet-version:
        type: string
        required: false
        default: latest
    secrets:
      NUGET_API_KEY:
        required: true
  workflow_dispatch:
    inputs:
      dotnet-version:
        description: Full version of .NET SDK
        required: false
        default: latest

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Compute package version
        id: version
        shell: bash
        run: |
          version="$(dotnet msbuild src/EgressPool/EgressPool.csproj -getProperty:Version -p:EnableCalendarVersion=true -nologo)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Package version: $version"

      - name: Build
        run: dotnet build EgressPool.slnx --configuration Release --nologo /p:Version=${{ steps.version.outputs.version }} /p:PackageVersion=${{ steps.version.outputs.version }}

      - name: Pack EgressPool
        run: dotnet pack src/EgressPool/EgressPool.csproj --configuration Release --no-build --output artifacts /p:Version=${{ steps.version.outputs.version }} /p:PackageVersion=${{ steps.version.outputs.version }}

      - name: Pack EgressPool.DependencyInjection
        run: dotnet pack src/EgressPool.DependencyInjection/EgressPool.DependencyInjection.csproj --configuration Release --no-build --output artifacts /p:Version=${{ steps.version.outputs.version }} /p:PackageVersion=${{ steps.version.outputs.version }}

      - name: Upload package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nuget-packages
          path: artifacts
          compression-level: 9
          if-no-files-found: error

      - name: NuGet Push
        run: dotnet nuget push artifacts/*.nupkg --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
