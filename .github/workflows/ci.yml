name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: latest

      - name: Restore
        run: dotnet restore EgressPool.slnx

      - name: Build
        run: dotnet build EgressPool.slnx --configuration Release --no-restore

      - name: Unit and behavior tests
        run: dotnet test tests/EgressPool.Tests/EgressPool.Tests.csproj --configuration Release --no-build

      - name: Platform tests
        if: runner.os == 'Windows'
        env:
          EGRESSPOOL_PLATFORM_TESTS: "1"
        run: dotnet test tests/EgressPool.PlatformTests/EgressPool.PlatformTests.csproj --configuration Release --no-build --logger "console;verbosity=normal"

      - name: Platform tests
        if: runner.os != 'Windows'
        shell: bash
        env:
          EGRESSPOOL_PLATFORM_TESTS: "1"
        run: sudo -E "$(command -v dotnet)" test tests/EgressPool.PlatformTests/EgressPool.PlatformTests.csproj --configuration Release --no-build --logger "console;verbosity=normal"
